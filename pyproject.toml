[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-document-intelligence"
version = "0.1.0"
description = "Evidence-linked clinical NLP and local LLM evaluation on synthetic notes"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
clinical-intelligence = "clinical_intelligence.pipeline:main"

[tool.setuptools.packages.find]
include = ["clinical_intelligence*"]
