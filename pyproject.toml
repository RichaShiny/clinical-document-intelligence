[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-ade"
version = "1.0.0"
description = "Research-backed pharmacovigilance evidence triage on real ADE case-report data"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "pandas>=2,<4", "pyarrow>=18", "scikit-learn>=1.6,<2", "torch>=2.6,<3", "transformers>=4.48,<6", "sklearn-crfsuite>=0.5,<0.6", "fastapi>=0.115,<1", "uvicorn>=0.30", "joblib>=1.4", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ade-prepare = "clinical_ade.data:main"
ade-train = "clinical_ade.train:main"
ade-transformer = "clinical_ade.biomed:main"

[tool.setuptools.packages.find]
where = ["src"]
